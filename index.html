<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Trading Terminal</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

<h1>AI Trading Terminal</h1>

<p>Indian Stock Analysis Engine</p>

</header>

<section class="search">

<input id="symbolInput" placeholder="Enter Stock (Example: INFY)">
<button onclick="analyzeStock()">Analyze</button>

</section>

<section class="grid">

<div class="card">

<h3>Price</h3>

<p id="price">--</p>

</div>

<div class="card">

<h3>RSI</h3>

<p id="rsi">--</p>

</div>

<div class="card">

<h3>MACD</h3>

<p id="macd">--</p>

</div>

<div class="card">

<h3>Signal</h3>

<p id="signal">--</p>

</div>

</section>

<section class="chart">

<canvas id="chart"></canvas>

</section>

<script src="script.js"></script>

</body>
</html>
